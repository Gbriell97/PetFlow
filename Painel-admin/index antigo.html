<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetFlow — Painel Super Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #334155;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --border: #334155;
  }
  * { font-family: 'Inter', sans-serif; }
  body { background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
  .glass { background: rgba(30,41,59,0.8); backdrop-filter: blur(12px); border: 1px solid var(--border); }
  .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); transition: all 0.2s; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 25px -5px rgba(99,102,241,0.4); }
  .input-dark { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); transition: all 0.2s; }
  .input-dark:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
  .card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; transition: all 0.2s; }
  .card:hover { border-color: var(--primary); transform: translateY(-2px); }
  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .toast { position: fixed; top: 20px; right: 20px; padding: 14px 20px; border-radius: 10px; color: white; font-weight: 500; z-index: 9999; animation: slideIn 0.3s ease-out; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; }
  .modal-content { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; max-width: 520px; width: 90%; max-height: 90vh; overflow-y: auto; }
  .modal-content-lg { max-width: 800px; }
  .copy-field { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-family: monospace; font-size: 13px; color: var(--text-secondary); position: relative; }
  .copy-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--bg-tertiary); border: none; color: var(--text-primary); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .copy-btn:hover { background: var(--primary); }
  .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-active { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
  .badge-inactive { background: rgba(239,68,68,0.15); color: var(--error); border: 1px solid rgba(239,68,68,0.3); }
  .badge-renewal { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
  .tab-btn { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-secondary); transition: all 0.2s; cursor: pointer; border: none; background: transparent; }
  .tab-btn:hover { color: var(--text-primary); background: rgba(99,102,241,0.1); }
  .tab-btn.active { background: var(--primary); color: white; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
        <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-2xl font-bold text-white mb-1">PetFlow Super Admin</h1>
      <p class="text-slate-400 text-sm">Gerencie todas as unidades da plataforma</p>
    </div>
    <div class="glass rounded-2xl p-8">
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
        <input type="email" id="loginEmail" class="input-dark w-full rounded-lg px-4 py-3" placeholder="seu@email.com" value="gabriel1997barreto@gmail.com">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-300 mb-2">Senha</label>
        <input type="password" id="loginPassword" class="input-dark w-full rounded-lg px-4 py-3" placeholder="••••••••">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-300 mb-2">URL da API</label>
        <input type="text" id="apiUrl" class="input-dark w-full rounded-lg px-4 py-3" placeholder="https://...supabase.co/functions/v1" value="https://jnmtwalmfkcxixiwqbjm.supabase.co/functions/v1">
      </div>
      <button onclick="doLogin()" id="loginBtn" class="btn-primary w-full py-3 rounded-lg font-semibold text-white flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Entrar</span>
      </button>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardScreen" class="hidden min-h-screen">
  <header class="glass sticky top-0 z-50 border-b border-slate-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
          <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-white text-sm">PetFlow</h1>
          <p class="text-[10px] text-slate-400 uppercase tracking-wider">Super Admin</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span id="adminName" class="text-sm text-slate-300 hidden sm:block"></span>
        <button onclick="logout()" class="text-slate-400 hover:text-white transition-colors">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
      <div class="card p-5">
        <div class="flex items-center justify-between mb-2">
          <span class="text-slate-400 text-sm">Total de Lojas</span>
          <i data-lucide="store" class="w-5 h-5 text-indigo-400"></i>
        </div>
        <p id="statTotal" class="text-2xl font-bold text-white">0</p>
      </div>
      <div class="card p-5">
        <div class="flex items-center justify-between mb-2">
          <span class="text-slate-400 text-sm">Ativas</span>
          <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
        </div>
        <p id="statActive" class="text-2xl font-bold text-emerald-400">0</p>
      </div>
      <div class="card p-5">
        <div class="flex items-center justify-between mb-2">
          <span class="text-slate-400 text-sm">Inativas</span>
          <i data-lucide="x-circle" class="w-5 h-5 text-rose-400"></i>
        </div>
        <p id="statInactive" class="text-2xl font-bold text-rose-400">0</p>
      </div>
    </div>

    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-semibold text-white">Unidades Cadastradas</h2>
      <button onclick="openNewUnitModal()" class="btn-primary px-5 py-2.5 rounded-lg font-medium text-white text-sm flex items-center gap-2">
        <i data-lucide="plus" class="w-4 h-4"></i> Nova Loja
      </button>
    </div>

    <div id="unitsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>
</div>

<!-- MODAL: NOVA LOJA -->
<div id="newUnitModal" class="hidden modal-overlay">
  <div class="modal-content p-6 fade-in">
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-lg font-bold text-white">Nova Loja</h3>
      <button onclick="closeNewUnitModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form id="newUnitForm" onsubmit="event.preventDefault(); createUnit();">
      <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Nome da Empresa *</label><input type="text" id="fCompany" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm" placeholder="Pet Shop Estrela LTDA" required></div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Nome da Unidade *</label><input type="text" id="fUnit" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm" placeholder="Estrela Pet — Rio Vermelho" required></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Nome do Dono *</label><input type="text" id="fOwnerName" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm" placeholder="Mariana Souza" required></div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Email do Dono *</label><input type="email" id="fOwnerEmail" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm" placeholder="dono@estrelapet.com.br" required></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Telefone</label><input type="text" id="fPhone" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm" placeholder="+5571988888888"></div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Cidade</label><input type="text" id="fCity" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm" placeholder="Salvador" value="Salvador"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Estado</label><input type="text" id="fState" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm" placeholder="BA" value="BA"></div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Timezone</label>
            <select id="fTimezone" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm">
              <option value="America/Bahia">America/Bahia</option>
              <option value="America/Sao_Paulo">America/Sao_Paulo</option>
              <option value="America/Fortaleza">America/Fortaleza</option>
              <option value="America/Recife">America/Recife</option>
            </select>
          </div>
        </div>
      </div>
      <div class="mt-6 flex gap-3">
        <button type="button" onclick="closeNewUnitModal()" class="flex-1 py-2.5 rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-700 transition-colors text-sm font-medium">Cancelar</button>
        <button type="submit" id="btnCreate" class="flex-1 btn-primary py-2.5 rounded-lg text-white text-sm font-medium flex items-center justify-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Criar Loja</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: CREDENCIAIS GERADAS -->
<div id="credentialsModal" class="hidden modal-overlay">
  <div class="modal-content p-6 fade-in">
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-full bg-emerald-500/20 flex items-center justify-center mx-auto mb-3"><i data-lucide="check-circle" class="w-7 h-7 text-emerald-400"></i></div>
      <h3 class="text-lg font-bold text-white">Loja Criada com Sucesso!</h3>
      <p class="text-sm text-slate-400 mt-1">Copie os dados abaixo e envie para o dono da loja</p>
    </div>
    <div class="space-y-3 mb-6">
      <div><label class="block text-xs text-slate-400 mb-1">Nome da Unidade</label><div id="credUnitName" class="text-white font-medium text-sm"></div></div>
      <div><label class="block text-xs text-slate-400 mb-1">API Key (para n8n / WhatsApp)</label><div class="copy-field"><span id="credApiKey"></span><button class="copy-btn" onclick="copyToClipboard('credApiKey')">Copiar</button></div></div>
      <div><label class="block text-xs text-slate-400 mb-1">Login do Dono</label><div class="copy-field"><span id="credEmail"></span><button class="copy-btn" onclick="copyToClipboard('credEmail')">Copiar</button></div></div>
      <div><label class="block text-xs text-slate-400 mb-1">Senha Temporária</label><div class="copy-field"><span id="credPassword"></span><button class="copy-btn" onclick="copyToClipboard('credPassword')">Copiar</button></div></div>
    </div>
    <div class="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 mb-6">
      <p class="text-xs text-amber-300 flex items-start gap-2"><i data-lucide="alert-triangle" class="w-4 h-4 shrink-0 mt-0.5"></i><span>Peça para o dono trocar a senha no primeiro acesso ao painel.</span></p>
    </div>
    <button onclick="closeCredentialsModal()" class="w-full btn-primary py-2.5 rounded-lg text-white text-sm font-medium">Fechar e voltar ao Dashboard</button>
  </div>
</div>

<!-- MODAL: GERENCIAR LOJA (DETALHES) -->
<div id="manageUnitModal" class="hidden modal-overlay">
  <div class="modal-content modal-content-lg p-6 fade-in">
    <div class="flex items-center justify-between mb-4">
      <div>
        <h3 id="manageUnitName" class="text-lg font-bold text-white"></h3>
        <p id="manageUnitPlan" class="text-xs text-slate-400 mt-0.5"></p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="deleteCurrentUnit()" class="px-3 py-1.5 rounded-lg border border-rose-600 text-rose-400 hover:bg-rose-600/20 text-xs font-medium flex items-center gap-1.5 transition-colors">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Excluir
        </button>
        <button onclick="closeManageUnitModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
    </div>

    <div class="flex gap-2 mb-6 overflow-x-auto pb-1">
      <button class="tab-btn active" data-tab="edit" onclick="switchTab('edit')">Editar Loja</button>
      <button class="tab-btn" data-tab="company" onclick="switchTab('company')">Dados Cadastrais</button>
      <button class="tab-btn" data-tab="users" onclick="switchTab('users')">Usuários</button>
      <button class="tab-btn" data-tab="subscription" onclick="switchTab('subscription')">Assinatura</button>
      <button class="tab-btn" data-tab="history" onclick="switchTab('history')">Histórico</button>
    </div>

    <!-- TAB: EDITAR LOJA -->
    <div id="tab-edit" class="tab-content">
      <form id="editUnitForm" onsubmit="event.preventDefault(); saveUnitEdit();">
        <input type="hidden" id="editUnitId">
        <input type="hidden" id="editCompanyId">
        <div class="space-y-4 max-h-[55vh] overflow-y-auto pr-2">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Nome da Unidade</label><input type="text" id="editName" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Telefone</label><input type="text" id="editPhone" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm"></div>
          </div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Descrição</label><textarea id="editDescription" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm h-20 resize-none" placeholder="Descrição que aparece no painel da loja..."></textarea></div>
          <div class="grid grid-cols-3 gap-4">
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Cor Primária</label><div class="flex items-center gap-2"><input type="color" id="editPrimaryColor" class="w-8 h-8 rounded cursor-pointer border-0 p-0" value="#6366f1"><input type="text" id="editPrimaryColorHex" class="input-dark w-full rounded-lg px-3 py-2 text-sm" value="#6366f1" onchange="document.getElementById('editPrimaryColor').value=this.value"></div></div>
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Cor Secundária</label><div class="flex items-center gap-2"><input type="color" id="editSecondaryColor" class="w-8 h-8 rounded cursor-pointer border-0 p-0" value="#8b5cf6"><input type="text" id="editSecondaryColorHex" class="input-dark w-full rounded-lg px-3 py-2 text-sm" value="#8b5cf6" onchange="document.getElementById('editSecondaryColor').value=this.value"></div></div>
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Cor Destaque</label><div class="flex items-center gap-2"><input type="color" id="editAccentColor" class="w-8 h-8 rounded cursor-pointer border-0 p-0" value="#10b981"><input type="text" id="editAccentColorHex" class="input-dark w-full rounded-lg px-3 py-2 text-sm" value="#10b981" onchange="document.getElementById('editAccentColor').value=this.value"></div></div>
          </div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">SEO Título</label><input type="text" id="editSeoTitle" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm" placeholder="Título da página no Google"></div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">SEO Descrição</label><textarea id="editSeoDescription" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm h-16 resize-none" placeholder="Descrição para motores de busca..."></textarea></div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Mensagem de Boas-vindas</label><textarea id="editWelcome" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm h-16 resize-none" placeholder="Mensagem exibida no painel da loja..."></textarea></div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Texto do Rodapé</label><textarea id="editFooter" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm h-16 resize-none" placeholder="Texto do rodapé..."></textarea></div>
        </div>
        <div class="mt-6">
          <button type="submit" id="btnSaveEdit" class="w-full btn-primary py-2.5 rounded-lg text-white text-sm font-medium flex items-center justify-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Salvar Alterações</button>
        </div>
      </form>
    </div>

    <!-- TAB: DADOS CADASTRAIS -->
    <div id="tab-company" class="tab-content hidden">
      <form id="editCompanyForm" onsubmit="event.preventDefault(); saveCompanyEdit();">
        <div class="space-y-4 max-h-[55vh] overflow-y-auto pr-2">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Razão Social</label><input type="text" id="editRazaoSocial" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">CNPJ / CPF</label><input type="text" id="editCnpjCpf" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm" placeholder="00.000.000/0000-00 ou 000.000.000-00"></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Email da Empresa</label><input type="email" id="editCompanyEmail" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Website</label><input type="text" id="editWebsite" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm" placeholder="https://..."></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Responsável</label><input type="text" id="editResponsible" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Telefone do Responsável</label><input type="text" id="editRespPhone" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm"></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Cidade</label><input type="text" id="editCity" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm"></div>
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Estado</label><input type="text" id="editState" class="input-dark w-full rounded-lg px-3 py-2.5 text-sm"></div>
          </div>
        </div>
        <div class="mt-6">
          <button type="submit" class="w-full btn-primary py-2.5 rounded-lg text-white text-sm font-medium flex items-center justify-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Salvar Dados Cadastrais</button>
        </div>
      </form>
    </div>

    <!-- TAB: USUÁRIOS -->
    <div id="tab-users" class="tab-content hidden">
      <div id="usersList" class="space-y-3 max-h-[55vh] overflow-y-auto pr-2"></div>
    </div>

    <!-- TAB: ASSINATURA -->
    <div id="tab-subscription" class="tab-content hidden">
      <div id="subscriptionContent"></div>
    </div>

    <!-- TAB: HISTÓRICO -->
    <div id="tab-history" class="tab-content hidden">
      <div id="historyContent" class="space-y-3 max-h-[55vh] overflow-y-auto pr-2"></div>
    </div>
  </div>
</div>

<script>
// ===================== STATE =====================
let state = {
  token: localStorage.getItem('pf_admin_token') || null,
  user: JSON.parse(localStorage.getItem('pf_admin_user') || 'null'),
  apiUrl: localStorage.getItem('pf_api_url') || 'https://jnmtwalmfkcxixiwqbjm.supabase.co/functions/v1',
  units: [],
  currentUnit: null,
  currentTab: 'edit'
};

document.addEventListener('DOMContentLoaded', () => {

    loadUnits();

// ===================== AUTH =====================
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const url = document.getElementById('apiUrl').value.trim();
  const btn = document.getElementById('loginBtn');

  if (!email || !password) { toast('Preencha email e senha', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="animate-spin inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full"></span> Entrando...';

  try {
    const res = await fetch(`${url}/auth-login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!data.success) {
      toast(data.error || 'Erro ao entrar', 'error');
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i><span>Entrar</span>';
      lucide.createIcons();
      return;
    }

    state.token = data.data.access_token;
    state.user = data.data.user;
    state.apiUrl = url;
    localStorage.setItem('pf_admin_token', state.token);
    localStorage.setItem('pf_admin_user', JSON.stringify(state.user));
    localStorage.setItem('pf_api_url', url);

    toast(`Bem-vindo, ${state.user.name || state.user.email}!`, 'success');
    showDashboard();
    loadUnits();

  } catch (err) {
    toast('Erro de conexão. Verifique a URL da API.', 'error');
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i><span>Entrar</span>';
    lucide.createIcons();
  }
}

function logout() {
  localStorage.removeItem('pf_admin_token');
  localStorage.removeItem('pf_admin_user');
  state.token = null;
  state.user = null;
  showLogin();
  toast('Desconectado', 'info');
}

  const total = state.units.length;

  document.getElementById('statTotal').textContent = total;

function closeNewUnitModal() {
  document.getElementById('newUnitModal').classList.add('hidden');

async function createUnit() {
  const btn = document.getElementById('btnCreate');
  btn.disabled = true;
  btn.innerHTML = '<span class="animate-spin inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full"></span> Criando...';

  const payload = {
    company_name: document.getElementById('fCompany').value.trim(),
    unit_name: document.getElementById('fUnit').value.trim(),
    owner_name: document.getElementById('fOwnerName').value.trim(),
    owner_email: document.getElementById('fOwnerEmail').value.trim(),
    phone: document.getElementById('fPhone').value.trim() || '+5571999999999',
    city: document.getElementById('fCity').value.trim() || 'Salvador',
    state: document.getElementById('fState').value.trim() || 'BA',
    timezone: document.getElementById('fTimezone').value,
  };

  try {
    const res = await fetch(`${state.apiUrl}/super-admin-create-unit`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${state.token}`
      },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (!data.success) {
      toast(data.error || 'Erro ao criar loja', 'error');
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="plus" class="w-4 h-4"></i> Criar Loja';
      lucide.createIcons();
      return;
    }

    state.units.unshift(data.data.unit);
    renderUnits();
    updateStats();
    closeNewUnitModal();

    document.getElementById('credUnitName').textContent = data.data.unit.name;
    document.getElementById('credApiKey').textContent = data.data.unit.api_key;
    document.getElementById('credEmail').textContent = data.data.owner.email;
    document.getElementById('credPassword').textContent = data.data.owner.temp_password;
    document.getElementById('credentialsModal').classList.remove('hidden');
    lucide.createIcons();
    toast('Loja criada com sucesso!', 'success');

  } catch (err) {
    toast('Erro de conexão ao criar loja', 'error');
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="plus" class="w-4 h-4"></i> Criar Loja';
    lucide.createIcons();
  }
}

function closeCredentialsModal() {

}

// ===================== MANAGE UNIT =====================
async function manageUnit(unitId) {
  state.currentUnit = state.units.find(u => u.id === unitId);
  if (!state.currentUnit) return;

  document.getElementById('manageUnitName').textContent = state.currentUnit.name;
  document.getElementById('manageUnitPlan').textContent = `Plano: Carregando... | Status: ${state.currentUnit.status || 'ACTIVE'}`;
  document.getElementById('manageUnitModal').classList.remove('hidden');
  switchTab('edit');

  // Carregar detalhes completos
  try {
    const res = await fetch(`${state.apiUrl}/super-admin-unit-detail?id=${unitId}`, {
      headers: { 'Authorization': `Bearer ${state.token}` }
    });
    const data = await res.json();
    if (data.success) {
      state.currentUnitDetail = data.data;
      populateEditForm(data.data);
      renderSubscription(data.data.subscription);
      renderUsers(data.data.users);
      renderHistory(data.data.audit_logs);
    }
  } catch (err) {
    toast('Erro ao carregar detalhes da loja', 'error');
  }
}

function closeManageUnitModal() {
  document.getElementById('manageUnitModal').classList.add('hidden');
  state.currentUnit = null;
  state.currentUnitDetail = null;
}

function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
  document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.remove('hidden');
  lucide.createIcons();
}

async function saveUnitEdit() {
  const btn = document.getElementById('btnSaveEdit');
  btn.disabled = true;
  btn.innerHTML = '<span class="animate-spin inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full"></span> Salvando...';

  const unitId = document.getElementById('editUnitId').value;
  const companyId = document.getElementById('editCompanyId').value;

  const unitData = {};
  const name = document.getElementById('editName').value.trim();
  const phone = document.getElementById('editPhone').value.trim();
  const description = document.getElementById('editDescription').value.trim();
  const primaryColor = document.getElementById('editPrimaryColor').value;
  const secondaryColor = document.getElementById('editSecondaryColor').value;
  const accentColor = document.getElementById('editAccentColor').value;
  const seoTitle = document.getElementById('editSeoTitle').value.trim();
  const seoDesc = document.getElementById('editSeoDescription').value.trim();
  const welcome = document.getElementById('editWelcome').value.trim();
  const footer = document.getElementById('editFooter').value.trim();

  if (name) unitData.name = name;
  if (phone) unitData.phone = phone;
  if (description) unitData.description = description;
  if (primaryColor) unitData.primary_color = primaryColor;
  if (secondaryColor) unitData.secondary_color = secondaryColor;
  if (accentColor) unitData.accent_color = accentColor;
  if (seoTitle) unitData.seo_title = seoTitle;
  if (seoDesc) unitData.seo_description = seoDesc;
  if (welcome) unitData.welcome_message = welcome;
  if (footer) unitData.footer_text = footer;

  try {
    const res = await fetch(`${state.apiUrl}/super-admin-unit-update`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${state.token}`
      },
      body: JSON.stringify({ unit_id: unitId, company_id: companyId, unit_data: unitData })
    });
    const data = await res.json();

    if (!data.success) {
      toast(data.error || 'Erro ao salvar', 'error');
    } else {
      toast('Alterações salvas com sucesso!', 'success');
      // Atualizar local
      const idx = state.units.findIndex(u => u.id === unitId);
      if (idx >= 0) {
        Object.assign(state.units[idx], unitData);
        renderUnits();
      }
    }
  } catch (err) {
    toast('Erro de conexão ao salvar', 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '<i data-lucide="save" class="w-4 h-4"></i> Salvar Alterações';
  lucide.createIcons();
}

async function resetUserPassword(userId, email) {
  if (!confirm(`Redefinir senha de ${email}? Uma nova senha temporária será gerada.`)) return;
  try {
    const res = await fetch(`${state.apiUrl}/super-admin-user-manage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
      body: JSON.stringify({ action: 'reset_password', user_id: userId })
    });
    const data = await res.json();
    if (data.success) {
      toast(`Nova senha: ${data.temp_password}`, 'success');
      alert(`Nova senha temporária para ${email}:

${data.temp_password}

Copie e envie para o usuário.`);
    } else {
      toast(data.error, 'error');
    }
  } catch (err) {
    toast('Erro ao redefinir senha', 'error');
  }
}

async function toggleUserBlock(userId, isActive) {
  const action = isActive ? 'block' : 'unblock';
  const msg = isActive ? 'Bloquear este usuário?' : 'Desbloquear este usuário?';
  if (!confirm(msg)) return;
  try {
    const res = await fetch(`${state.apiUrl}/super-admin-user-manage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.token}` },
      body: JSON.stringify({ action, user_id: userId, unit_id: state.currentUnit?.id })
    });
    const data = await res.json();
    if (data.success) {
      toast(data.message, 'success');
      manageUnit(state.currentUnit.id); // recarregar
    } else {
      toast(data.error, 'error');
    }
  } catch (err) {
    toast('Erro ao alterar status do usuário', 'error');
  }
}

function toast(message, type = 'info') {
  const colors = { success: 'bg-emerald-500', error: 'bg-rose-500', warning: 'bg-amber-500', info: 'bg-indigo-500' };
  const el = document.createElement('div');
  el.className = `toast ${colors[type] || colors.info}`;
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(100%)'; setTimeout(() => el.remove(), 300); }, 4000);
}
</script>
</body>
</html>
