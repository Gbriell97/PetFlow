# PetFlow — Stack n8n
# Sobe o n8n com banco Postgres próprio (recomendado para produção).
# Obs.: já existe um container "n8n_local" rodando na porta 5678 nesta máquina.
# Este compose serve para reproduzir/migrar o ambiente. Se for subir aqui,
# pare o container antigo antes: docker stop n8n_local

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: petflow-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Banco próprio do n8n (workflows, credenciais, execuções)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      # Fuso padrão da plataforma (cada unidade terá o seu no banco — Decisão 37)
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Bahia}
      - TZ=${GENERIC_TIMEZONE:-America/Bahia}
      # Variáveis usadas pelos workflows PetFlow
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - PETFLOW_API_KEY=${PETFLOW_API_KEY}
      - AVISA_API_KEY=${AVISA_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: petflow-n8n-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${N8N_DB_NAME:-n8n}
      - POSTGRES_USER=${N8N_DB_USER:-n8n}
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
  n8n_db_data:
